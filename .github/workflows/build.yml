name: Build Application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller # Install only the required build dependency

    - name: Install ImageMagick (for icon resizing)
      run: sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Install Linux Build Dependencies (X11/Qt)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libxcb-icccm4-dev \
          libxcb-image0-dev \
          libxcb-keysyms1-dev \
          libxcb-render-util0-dev \
          libxcb-shape0-dev \
          libxcb-xinerama0-dev \
          libxcb-xkb-dev \
          libxkbcommon-x11-dev \
          libxcb-cursor-dev # Added based on specific warnings

    - name: Download appimagetool
      run: |
        mkdir -p lib
        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O lib/appimagetool-x86_64.AppImage
        chmod +x lib/appimagetool-x86_64.AppImage

    - name: Build AppImage
      run: ./scripts/build_appimage.sh

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReactionTimer-AppImage
        path: out/ReactionTimer-x86_64.AppImage
        if-no-files-found: error # Error if the file doesn't exist

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller # Install only the required build dependency
      shell: bash # Use bash for consistency with pip commands

    - name: Install ImageMagick via Chocolatey (for icon conversion)
      run: choco install imagemagick.app --no-progress # Remove version pinning
      shell: pwsh # Use PowerShell for choco

    - name: Build EXE
      run: ./scripts/build_appimage.sh # Script detects OS and runs build_windows()
      shell: bash # Ensure bash is used to run the script

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReactionTimer-Windows
        path: out/ReactionTimer.exe
        if-no-files-found: error # Error if the file doesn't exist 