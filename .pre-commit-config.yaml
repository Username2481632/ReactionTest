repos:
-   repo: local
    hooks:
    -   id: build-appimage
        name: Build AppImage
        entry: scripts/build_appimage.sh
        language: script
        always_run: true
        pass_filenames: false
        verbose: true # Show output from the script
    -   id: pytype
        name: Python Type Checker (pytype)
        entry: scripts/run_pytype.sh
        language: script
        types: [python]
        pass_filenames: false 