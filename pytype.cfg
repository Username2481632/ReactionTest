[pytype]
python_version = 3.12
inputs = src
exclude = venv/*,.git/*,out/*
# Keep basic analysis settings here
analyze_annotated = true
# Enforce strict type checking rules
strict_import = true
check_attribute_types = true
check_container_types = true
check_parameter_types = true
check_variable_types = true
enable_nested_classes = true
protocols = true
require_return_types = true
# Report all errors encountered
no_report_errors = false
# Remove keep_going for maximum strictness (stop on first error)
# keep_going = true 